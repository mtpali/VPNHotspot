name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Check Rust daemon
        working-directory: mobile/src/main/rust/vpnhotspotd
        run: cargo check --locked --all-targets

      - name: Check Rust formatting
        working-directory: mobile/src/main/rust/vpnhotspotd
        run: cargo fmt --all -- --check

      - name: Run Rust daemon clippy
        working-directory: mobile/src/main/rust/vpnhotspotd
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Audit Rust daemon dependencies
        working-directory: mobile/src/main/rust/vpnhotspotd
        run: cargo audit

      - name: Test Rust daemon
        working-directory: mobile/src/main/rust/vpnhotspotd
        run: cargo test --locked

      - name: Compile Android instrumentation tests
        run: ./gradlew :mobile:compileDebugAndroidTestKotlin -PtargetAbis=x86_64 --no-daemon

      - name: Run build and tests
        run: ./gradlew :mobile:assembleDebug :mobile:testDebugUnitTest :mobile:lintDebug :mobile:assembleRelease -PtargetAbis=armeabi-v7a --no-daemon

      - name: Check release shrinking
        run: test -s mobile/build/outputs/mapping/release/mapping.txt

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: mobile/build/outputs/apk

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: mobile/build/reports

      - name: Build Android 9 instrumentation APKs
        run: ./gradlew :mobile:assembleDebug :mobile:assembleDebugAndroidTest -PtargetAbis=x86_64 --no-daemon

      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm

      - name: Test Android 9 runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          disable-animations: true
          script: ./gradlew :mobile:connectedDebugAndroidTest -PtargetAbis=x86_64 --no-daemon

      - name: Upload Android 9 reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android9-reports
          path: |
            mobile/build/reports/androidTests
            mobile/build/outputs/androidTest-results
