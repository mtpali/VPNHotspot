name: Android 9 compatibility
on:
  push:
    branches:
      - codex/android9-armv7-20261002
  workflow_dispatch:

jobs:
  android9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Set up native toolchain
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          rustup target add x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build Android 9 compatibility tests
        run: ./gradlew :mobile:assembleDebug :mobile:assembleDebugAndroidTest -PtargetAbis=x86_64 --no-daemon
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Verify Android 9 app and root daemon
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb root
            ./gradlew :mobile:connectedDebugAndroidTest -PtargetAbis=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=be.mygod.vpnhotspot.Android9CompatibilityTest --no-daemon
      - name: Upload compatibility reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android9-compatibility-reports
          path: |
            mobile/build/reports/androidTests
            mobile/build/outputs/androidTest-results
